<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Attendance Management System</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f5f9;
            padding: 20px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #222;
        }

        .form-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        input {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            flex: 1;
            min-width: 180px;
        }

        button {
            padding: 12px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .add-btn {
            background: #2196f3;
            color: white;
        }

        .present-btn {
            background: #4caf50;
            color: white;
        }

        .absent-btn {
            background: #f44336;
            color: white;
        }

        .delete-btn {
            background: #555;
            color: white;
        }

        .search {
            width: 100%;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #2196f3;
            color: white;
        }

        .percentage {
            font-weight: bold;
        }

        .good {
            color: green;
        }

        .warning {
            color: orange;
        }

        .danger {
            color: red;
        }

        @media (max-width: 700px) {
            table {
                font-size: 12px;
            }

            th, td {
                padding: 7px;
            }

            button {
                padding: 8px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🎓 Student Attendance Management System</h1>

    <!-- Add Student -->
    <div class="form-box">

        <input
            type="text"
            id="rollNumber"
            placeholder="Enter Roll Number"
        >

        <input
            type="text"
            id="studentName"
            placeholder="Enter Student Name"
        >

        <button class="add-btn" onclick="addStudent()">
            Add Student
        </button>

    </div>

    <!-- Search -->
    <input
        class="search"
        type="text"
        id="search"
        placeholder="🔍 Search student..."
        onkeyup="searchStudent()"
    >

    <!-- Attendance Table -->
    <table>

        <thead>
            <tr>
                <th>Roll No</th>
                <th>Name</th>
                <th>Present</th>
                <th>Absent</th>
                <th>Total Classes</th>
                <th>Attendance %</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody id="studentTable">
        </tbody>

    </table>

</div>

<script>

    // Load students from browser storage
    let students = JSON.parse(localStorage.getItem("students")) || [];

    // Display students when page opens
    displayStudents();


    // Add Student
    function addStudent() {

        let rollNumber =
            document.getElementById("rollNumber").value.trim();

        let studentName =
            document.getElementById("studentName").value.trim();

        if (rollNumber === "" || studentName === "") {
            alert("Please enter Roll Number and Student Name.");
            return;
        }

        // Check duplicate roll number
        let duplicate = students.some(
            student => student.roll === rollNumber
        );

        if (duplicate) {
            alert("This roll number already exists.");
            return;
        }

        let student = {
            roll: rollNumber,
            name: studentName,
            present: 0,
            absent: 0
        };

        students.push(student);

        saveData();

        document.getElementById("rollNumber").value = "";
        document.getElementById("studentName").value = "";

        displayStudents();
    }


    // Display Students
    function displayStudents(list = students) {

        let table =
            document.getElementById("studentTable");

        table.innerHTML = "";

        list.forEach((student, index) => {

            let total =
                student.present + student.absent;

            let percentage =
                total === 0
                ? 0
                : ((student.present / total) * 100).toFixed(2);

            let percentageClass = "";

            if (percentage >= 75) {
                percentageClass = "good";
            }
            else if (percentage >= 50) {
                percentageClass = "warning";
            }
            else {
                percentageClass = "danger";
            }

            let row = document.createElement("tr");

            row.innerHTML = `

                <td>${student.roll}</td>

                <td>${student.name}</td>

                <td>
                    <button
                        class="present-btn"
                        onclick="markPresent(${index})">
                        Present
                    </button>

                    <br>
                    ${student.present}
                </td>

                <td>
                    <button
                        class="absent-btn"
                        onclick="markAbsent(${index})">
                        Absent
                    </button>

                    <br>
                    ${student.absent}
                </td>

                <td>
                    ${total}
                </td>

                <td class="percentage ${percentageClass}">
                    ${percentage}%
                </td>

                <td>
                    <button
                        class="delete-btn"
                        onclick="deleteStudent(${index})">
                        Delete
                    </button>
                </td>

            `;

            table.appendChild(row);
        });
    }


    // Mark Present
    function markPresent(index) {

        students[index].present++;

        saveData();

        displayStudents();
    }


    // Mark Absent
    function markAbsent(index) {

        students[index].absent++;

        saveData();

        displayStudents();
    }


    // Delete Student
    function deleteStudent(index) {

        let confirmDelete =
            confirm("Are you sure you want to delete this student?");

        if (confirmDelete) {

            students.splice(index, 1);

            saveData();

            displayStudents();
        }
    }


    // Search Student
    function searchStudent() {

        let search =
            document
            .getElementById("search")
            .value
            .toLowerCase();

        let filteredStudents =
            students.filter(student =>
                student.name.toLowerCase().includes(search) ||
                student.roll.toLowerCase().includes(search)
            );

        displayStudents(filteredStudents);
    }


    // Save Data
    function saveData() {

        localStorage.setItem(
            "students",
            JSON.stringify(students)
        );
    }

</script>

</body>
</html>
